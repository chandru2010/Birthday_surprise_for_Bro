<!-- ================= MEMORIES MENU ================= -->

<section class="screen" id="screen5">

    <div class="content">

        <div class="small">
            A little trip down memory lane
        </div>

        <h2>
            Choose a memory 📸
        </h2>

        <div class="memory-buttons">

            <button class="memory-btn"
                    onclick="openMemory('baby.jpg','Look at this little guy! 👶❤️')">
                👶 Baby
            </button>

            <button class="memory-btn"
                    onclick="openMemory('frnds1.jpg','And then came the school days... 🏫')">
                🏫 Friends
            </button>

            <button class="memory-btn"
                    onclick="openMemory('frnds2.jpg','Some memories just stay. ❤️')">
                🤝 Memories
            </button>

            <button class="memory-btn"
                    onclick="openMemory('Frnds3.jpg','Brotherhood moments. 😎')">
                😎 Us
            </button>

            <button class="memory-btn"
                    onclick="openMemory('hill.jpg','A few places, a lot of memories. 🌄')">
                🌄 Adventure
            </button>

            <button class="memory-btn"
                    onclick="openMemory('mirror.jpg','And somehow... that little kid grew up.')">
                🪞 Growing Up
            </button>

        </div>

        <div class="memory-photo">

            <img id="memoryImage"
                 src="baby.jpg"
                 alt="Memory">

            <div class="caption"
                 id="memoryCaption">
                Look at this little guy! 👶❤️
            </div>

        </div>

        <button class="btn" onclick="showScreen('screen6')">
            One serious thing ❤️
        </button>

    </div>

</section>
